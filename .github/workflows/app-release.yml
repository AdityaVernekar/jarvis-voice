name: App release

# Builds the Mac app when a tag like app-v0.1.0 is pushed and publishes a GitHub release with the
# DMG, the zip and a SHA256SUMS file. The app's one-click update downloads the zip and checks it
# against SHA256SUMS (and GitHub's own asset digest). The build is ad-hoc signed (not notarized):
# see docs/desktop-app.md.
on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build universal DMG
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --mac --universal --publish never
      - name: Check the signature
        working-directory: app
        run: codesign --verify --deep --strict --verbose=2 "dist/mac-universal/Earpiece.app"
      - name: Checksums
        working-directory: app/dist
        run: shasum -a 256 *.dmg *.zip | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          make_latest: true
          files: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/SHA256SUMS
